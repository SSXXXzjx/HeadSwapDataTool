<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>换头数据集</title>
  <link rel="stylesheet" href="styles.css">
  <script src="dataset-store.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></symbol>
    <symbol id="icon-replace" viewBox="0 0 24 24"><path d="M4 8h14l-4-4m6 12H6l4 4M4 8v5m16 3v-5"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m3 16 5-5 5 5 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.5"/></symbol>
  </svg>
  <main class="workspace">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg><use href="#icon-image"/></svg></div>
        <div><div class="eyebrow">DATASET STUDIO</div><h1>换头数据集<span class="version"> / 01</span></h1></div>
      </div>
      <div class="workspace-actions">
        <span id="save-status" class="save-status" role="status" aria-live="polite"><i></i><span>正在载入</span></span>
        <button id="folder-button" class="button folder-button"><svg><use href="#icon-folder"/></svg><span id="folder-label">选择数据集文件夹</span></button>
      </div>
    </header>

    <section class="editor" aria-label="分组编辑">
      <div class="section-bar">
        <div class="group-heading"><span class="eyebrow">GROUP</span><span id="group-number">000001</span><span id="group-badge" class="badge">待完成</span></div>
        <span class="completion"><span id="filled-count">0</span><span class="muted"> / 3</span><span class="completion-line"><i id="completion-progress"></i></span></span>
      </div>
      <div class="image-grid">
        <article class="image-card active" data-slot="reference" tabindex="0" aria-label="参考人头，图片输入区">
          <div class="card-header"><div class="card-title"><span class="card-number">01</span><h2>参考人头</h2></div><span class="directory-label">control_2</span><button class="button choose-image-button" aria-label="选择参考人头图片"><svg><use href="#icon-folder"/></svg><span>选择图片</span></button></div>
          <button class="image-stage" aria-label="选中参考人头粘贴区" aria-pressed="true"><span class="selection-indicator">已选中 · Ctrl+V 粘贴</span><span class="empty-state"><span class="add-icon"><svg><use href="#icon-plus"/></svg></span><span class="empty-title">拖入图片</span><span class="empty-hint">点击选中后 Ctrl+V 粘贴</span></span><img class="card-image" hidden alt="参考人头"></button>
          <div class="card-footer"><span class="image-info">等待图片</span><button class="preview-button" aria-label="预览参考人头" title="放大预览" hidden><svg><use href="#icon-expand"/></svg><span>预览</span></button></div>
          <input class="image-input" type="file" accept="image/*" hidden>
        </article>
        <article class="image-card" data-slot="target" tabindex="0" aria-label="人物底图，图片输入区">
          <div class="card-header"><div class="card-title"><span class="card-number">02</span><h2>人物底图</h2></div><span class="directory-label">target</span><button class="button choose-image-button" aria-label="选择人物底图图片"><svg><use href="#icon-folder"/></svg><span>选择图片</span></button></div>
          <button class="image-stage" aria-label="选中人物底图粘贴区" aria-pressed="false"><span class="selection-indicator">已选中 · Ctrl+V 粘贴</span><span class="empty-state"><span class="add-icon"><svg><use href="#icon-plus"/></svg></span><span class="empty-title">拖入图片</span><span class="empty-hint">点击选中后 Ctrl+V 粘贴</span></span><img class="card-image" hidden alt="人物底图"></button>
          <div class="card-footer"><span class="image-info">等待图片</span><button class="preview-button" aria-label="预览人物底图" title="放大预览" hidden><svg><use href="#icon-expand"/></svg><span>预览</span></button></div>
          <input class="image-input" type="file" accept="image/*" hidden>
        </article>
        <article class="image-card" data-slot="result" tabindex="0" aria-label="换头结果，图片输入区">
          <div class="card-header"><div class="card-title"><span class="card-number">03</span><h2>换头结果</h2></div><span class="directory-label">control_1</span><button class="button choose-image-button" aria-label="选择换头结果图片"><svg><use href="#icon-folder"/></svg><span>选择图片</span></button></div>
          <button class="image-stage" aria-label="选中换头结果粘贴区" aria-pressed="false"><span class="selection-indicator">已选中 · Ctrl+V 粘贴</span><span class="empty-state"><span class="add-icon"><svg><use href="#icon-plus"/></svg></span><span class="empty-title">拖入图片</span><span class="empty-hint">点击选中后 Ctrl+V 粘贴</span></span><img class="card-image" hidden alt="换头结果"></button>
          <div class="card-footer"><span class="image-info">等待图片</span><button class="preview-button" aria-label="预览换头结果" title="放大预览" hidden><svg><use href="#icon-expand"/></svg><span>预览</span></button></div>
          <input class="image-input" type="file" accept="image/*" hidden>
        </article>
      </div>
      <div class="prompt-panel"><div class="prompt-label"><label for="prompt">提示词</label><span id="prompt-file">target / 000001.txt</span><button id="apply-prompt-all" class="button apply-prompt-button">应用到全部组</button></div><textarea id="prompt" placeholder="输入提示词…" spellcheck="false" aria-label="当前组提示词"></textarea></div>
    </section>

    <footer class="navigation">
      <div class="navigation-meta"><span id="completed-total">0</span><span>组已完成</span><span class="separator">/</span><span id="total-groups">1</span><span>组</span></div>
      <div class="group-navigation"><button id="previous-button" class="button icon-button" aria-label="上一组" title="上一组"><svg class="rotate"><use href="#icon-arrow"/></svg></button><label class="group-select-label"><span class="visually-hidden">选择分组</span><select id="group-select" aria-label="选择分组"></select></label><button id="next-button" class="button primary-button"><span>下一组</span><svg><use href="#icon-arrow"/></svg></button></div>
    </footer>
  </main>

  <dialog id="directory-dialog" class="message-dialog directory-dialog" aria-labelledby="directory-title"><div class="directory-dialog-content"><div class="dialog-symbol"><svg><use href="#icon-folder"/></svg></div><h2 id="directory-title">请先确定保存路径</h2><p id="directory-message">请选择有效且可写入的数据集文件夹，完成后开始编辑。</p><button id="directory-confirm" class="button primary-button"><svg><use href="#icon-folder"/></svg><span>选择保存文件夹</span></button></div></dialog>

  <dialog id="message-dialog" class="message-dialog"><form method="dialog"><div class="dialog-symbol"><svg><use href="#icon-image"/></svg></div><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="dialog-actions"><button id="dialog-cancel" class="button" value="cancel">取消</button><button id="dialog-confirm" class="button primary-button" value="confirm">确定</button></div></form></dialog>
  <dialog id="preview-dialog" class="preview-dialog"><div class="preview-topbar"><div><span id="preview-label"></span><span id="preview-size"></span></div><button id="preview-close" class="button icon-button" aria-label="关闭预览"><svg><use href="#icon-close"/></svg></button></div><div class="preview-body"><img id="preview-image" alt="图片放大预览"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
